- name: Check whether the Sysmon service exists
  ansible.windows.win_service:
    name: "{{ sysmon_service_name }}"
  register: sysmon_service
  failed_when: false

- name: Create the Sysmon installation directory
  ansible.windows.win_file:
    path: "{{ sysmon_install_location }}"
    state: directory

- name: Download Sysmon from Microsoft Sysinternals
  ansible.windows.win_get_url:
    url: "{{ sysmon_download_url }}"
    dest: "{{ sysmon_archive_path }}"
  register: sysmon_download
  until: sysmon_download is succeeded
  retries: 3
  delay: 5
  when: not sysmon_service.exists

- name: Extract Sysmon
  community.windows.win_unzip:
    src: "{{ sysmon_archive_path }}"
    dest: "{{ sysmon_install_location }}"
  when: not sysmon_service.exists

- name: Verify the Sysmon binary is signed by Microsoft
  ansible.windows.win_powershell:
    script: |
      $signature = Get-AuthenticodeSignature -LiteralPath '{{ sysmon_executable_path }}'
      if ($signature.Status -ne 'Valid' -or
          $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
          throw "Sysmon64.exe does not have a valid Microsoft signature"
      }
      $Ansible.Changed = $false
  when: not sysmon_service.exists

- name: Download the pinned SwiftOnSecurity Sysmon configuration
  ansible.windows.win_get_url:
    url: "{{ sysmon_config_url }}"
    dest: "{{ sysmon_config_path }}"
    checksum: "{{ sysmon_config_checksum }}"
    checksum_algorithm: sha256
    force: false
  register: sysmon_config
  until: sysmon_config is succeeded
  retries: 3
  delay: 5

- name: Install Sysmon with the SwiftOnSecurity configuration
  ansible.windows.win_command: >-
    "{{ sysmon_executable_path }}" -accepteula -i "{{ sysmon_config_path }}"
  args:
    chdir: "{{ sysmon_install_location }}"
  when: not sysmon_service.exists

- name: Apply an updated SwiftOnSecurity configuration
  ansible.windows.win_command: >-
    "{{ sysmon_executable_path }}" -c "{{ sysmon_config_path }}"
  args:
    chdir: "{{ sysmon_install_location }}"
  when:
    - sysmon_service.exists
    - sysmon_config.changed

- name: Ensure the Sysmon service is enabled and running
  ansible.windows.win_service:
    name: "{{ sysmon_service_name }}"
    state: started
    start_mode: auto

- name: Verify the Sysmon Operational event channel is available
  ansible.windows.win_powershell:
    script: |
      $channel = Get-WinEvent -ListLog 'Microsoft-Windows-Sysmon/Operational' `
        -ErrorAction Stop
      if (-not $channel.IsEnabled) {
          throw 'The Sysmon Operational event channel is disabled'
      }
      $Ansible.Changed = $false
