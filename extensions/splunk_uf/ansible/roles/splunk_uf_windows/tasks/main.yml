- name: Check whether Splunk Universal Forwarder is installed
  ansible.windows.win_service:
    name: "{{ splunk_uf_service_name }}"
  register: splunk_uf_service
  failed_when: false

- name: Validate the Splunk Universal Forwarder local credential
  ansible.builtin.assert:
    that:
      - splunk_uf_admin_password | length >= 8
      - splunk_uf_admin_password is match('^[^\s"]{8,128}$')
    fail_msg: Export GOAD_SPLUNK_UF_PASSWORD with a lab-specific password before installing Splunk UF.
  no_log: true
  when: not splunk_uf_service.exists

- name: Create the Splunk UF download directory
  ansible.windows.win_file:
    path: "{{ splunk_uf_download_dir }}"
    state: directory
  when: not splunk_uf_service.exists

- name: Download Splunk Universal Forwarder
  ansible.windows.win_get_url:
    url: "{{ splunk_uf_download_url }}"
    dest: "{{ splunk_uf_msi_path }}"
    force: false
  register: splunk_uf_download
  until: splunk_uf_download is succeeded
  retries: 3
  delay: 10
  when: not splunk_uf_service.exists

- name: Verify the Splunk UF MSI Authenticode signature
  ansible.windows.win_powershell:
    script: |
      $signature = Get-AuthenticodeSignature -LiteralPath '{{ splunk_uf_msi_path }}'
      if ($signature.Status -ne 'Valid' -or
          $signature.SignerCertificate.Subject -notmatch 'Splunk') {
          throw 'The Splunk Universal Forwarder MSI does not have a valid Splunk signature'
      }
      $Ansible.Changed = $false
  when: not splunk_uf_service.exists

- name: Install Splunk UF as LocalSystem with a recoverable local login
  ansible.windows.win_package:
    path: "{{ splunk_uf_msi_path }}"
    state: present
    creates_service: "{{ splunk_uf_service_name }}"
    arguments: >-
      AGREETOLICENSE=Yes
      SPLUNKUSERNAME={{ splunk_uf_admin_user }}
      SPLUNKPASSWORD={{ splunk_uf_admin_password }}
      USE_LOCAL_SYSTEM=1
      LAUNCHSPLUNK=0
      SERVICESTARTTYPE=auto
  register: splunk_uf_install
  no_log: true
  when: not splunk_uf_service.exists

- name: Create the GOAD Splunk application directory
  ansible.windows.win_file:
    path: "{{ splunk_uf_app_local_dir }}"
    state: directory

- name: Configure Windows and Sysmon event inputs
  ansible.windows.win_template:
    src: inputs.conf.j2
    dest: "{{ splunk_uf_app_local_dir }}\\inputs.conf"
  register: splunk_uf_inputs
  notify: Restart Splunk Universal Forwarder

- name: Configure direct forwarding without a Deployment Server
  ansible.windows.win_template:
    src: outputs.conf.j2
    dest: "{{ splunk_uf_app_local_dir }}\\outputs.conf"
  register: splunk_uf_outputs
  notify: Restart Splunk Universal Forwarder

- name: Force Advanced Audit Policy subcategories to override legacy audit policy
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: SCENoApplyLegacyAuditPolicy
    data: 1
    type: dword
  when: splunk_uf_force_advanced_audit_policy | bool

- name: Check available Advanced Audit Policy subcategories
  ansible.windows.win_command: >-
    auditpol.exe /get /subcategory:"{{ item.subcategory }}"
  loop: "{{ splunk_uf_advanced_audit_policy }}"
  loop_control:
    label: "{{ item.subcategory }}"
  register: splunk_uf_audit_subcategory_checks
  changed_when: false
  failed_when: false
  when: splunk_uf_configure_advanced_audit_policy | bool

- name: Configure available Advanced Audit Policy subcategories
  ansible.windows.win_command: >-
    auditpol.exe /set /subcategory:"{{ item.item.subcategory }}"
    /success:{{ item.item.success }} /failure:{{ item.item.failure }}
  loop: "{{ splunk_uf_audit_subcategory_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.subcategory }}"
  changed_when: false
  when:
    - splunk_uf_configure_advanced_audit_policy | bool
    - item.rc == 0

- name: Include command lines in process creation events
  ansible.windows.win_regedit:
    path: HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit
    name: ProcessCreationIncludeCmdLine_Enabled
    data: 1
    type: dword
  when: splunk_uf_include_process_command_line | bool

- name: Enable PowerShell Script Block Logging
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: 1
    type: dword
  when: splunk_uf_enable_powershell_logging | bool

- name: Enable PowerShell Script Block Invocation Logging
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockInvocationLogging
    data: 1
    type: dword
  when: splunk_uf_enable_powershell_logging | bool

- name: Enable PowerShell Module Logging
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\PowerShell\ModuleLogging
    name: EnableModuleLogging
    data: 1
    type: dword
  when: splunk_uf_enable_powershell_logging | bool

- name: Log all PowerShell modules
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames
    name: "*"
    data: "*"
    type: string
  when: splunk_uf_enable_powershell_logging | bool

- name: Audit incoming NTLM traffic without blocking authentication
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
    name: AuditReceivingNTLMTraffic
    data: 2
    type: dword
  when: splunk_uf_enable_ntlm_incoming_audit | bool

- name: Audit DCSync replication rights at the domain root
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $domainDn = (Get-ADRootDSE).defaultNamingContext
      $domainPath = "AD:\$domainDn"
      $domainAcl = Get-Acl -Path $domainPath -Audit
      $everyone = [System.Security.Principal.SecurityIdentifier]'S-1-1-0'
      $replicationRightGuids = @(
          [Guid]'1131f6aa-9c07-11d1-f79f-00c04fc2dcd2',
          [Guid]'1131f6ad-9c07-11d1-f79f-00c04fc2dcd2',
          [Guid]'89e95b76-444d-4c62-991a-0facbeda640c'
      )
      $changed = $false
      foreach ($rightGuid in $replicationRightGuids) {
          $exists = $domainAcl.Audit | Where-Object {
              $_.ObjectType -eq $rightGuid -and
              ($_.ActiveDirectoryRights -band [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight) -and
              ($_.AuditFlags -band [System.Security.AccessControl.AuditFlags]::Success) -and
              $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -eq $everyone.Value
          }
          if (-not $exists) {
              $rule = [System.DirectoryServices.ActiveDirectoryAuditRule]::new(
                  $everyone,
                  [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight,
                  [System.Security.AccessControl.AuditFlags]::Success,
                  $rightGuid,
                  [System.DirectoryServices.ActiveDirectorySecurityInheritance]::None
              )
              $domainAcl.AddAuditRule($rule)
              $changed = $true
          }
      }
      if ($changed) { Set-Acl -Path $domainPath -AclObject $domainAcl }
      $Ansible.Changed = $changed
  when:
    - splunk_uf_enable_dcsync_sacl | bool
    - "'dc' in group_names"

- name: Enable monitored Windows event channels when present
  ansible.windows.win_powershell:
    script: |
      $logName = '{{ item }}'
      $log = Get-WinEvent -ListLog $logName -ErrorAction SilentlyContinue
      if ($null -eq $log) {
          $Ansible.Changed = $false
          $Ansible.Result = 'channel_not_present'
          return
      }
      if (-not $log.IsEnabled) {
          & wevtutil.exe sl $logName /e:true
          if ($LASTEXITCODE -ne 0) { throw "Unable to enable $logName" }
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }
  loop: "{{ splunk_uf_enable_event_channels }}"
  loop_control:
    label: "{{ item }}"

- name: Enable DNS Server Analytical logging when the channel exists
  ansible.windows.win_powershell:
    script: |
      $logName = 'Microsoft-Windows-DNSServer/Analytical'
      $log = Get-WinEvent -ListLog $logName -ErrorAction SilentlyContinue
      if ($null -eq $log) {
          $Ansible.Changed = $false
          $Ansible.Result = 'channel_not_present'
          return
      }
      if (-not $log.IsEnabled) {
          & wevtutil.exe sl $logName /e:true
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to enable $logName"
          }
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }
  when: splunk_uf_enable_dns_analytical | bool

- name: Increase monitored Windows event log sizes when present
  ansible.windows.win_powershell:
    script: |
      $logName = '{{ item.name }}'
      $targetSize = [long]{{ item.bytes }}
      $log = Get-WinEvent -ListLog $logName -ErrorAction SilentlyContinue
      if ($null -eq $log) {
          $Ansible.Changed = $false
          $Ansible.Result = 'channel_not_present'
          return
      }
      if ([long]$log.MaximumSizeInBytes -ne $targetSize) {
          & wevtutil.exe sl $logName /ms:$targetSize
          if ($LASTEXITCODE -ne 0) { throw "Unable to resize $logName" }
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }
  loop: "{{ splunk_uf_event_log_sizes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable full certification authority auditing on AD CS servers
  ansible.windows.win_powershell:
    script: |
      $configurationPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration'
      if (-not (Test-Path $configurationPath)) {
          $Ansible.Changed = $false
          return
      }
      $activeName = (Get-ItemProperty -Path $configurationPath -Name Active).Active
      $caPath = Join-Path $configurationPath $activeName
      $current = (Get-ItemProperty -Path $caPath -Name AuditFilter -ErrorAction SilentlyContinue).AuditFilter
      if ($current -ne 127) {
          & certutil.exe -setreg CA\AuditFilter 127 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Unable to configure CA audit filter' }
          Restart-Service CertSvc
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }
  when:
    - splunk_uf_enable_adcs_auditing | bool
    - "'adcs' in group_names"

- name: Validate the effective Splunk input configuration
  ansible.windows.win_command: >-
    "{{ splunk_uf_install_dir }}\\bin\\splunk.exe" btool inputs list --debug
  changed_when: false

- name: Validate the effective Splunk output configuration
  ansible.windows.win_command: >-
    "{{ splunk_uf_install_dir }}\\bin\\splunk.exe" btool outputs list --debug
  changed_when: false

- name: Ensure Splunk Universal Forwarder is enabled and running
  ansible.windows.win_service:
    name: "{{ splunk_uf_service_name }}"
    state: started
    start_mode: auto

- name: Apply pending Splunk UF configuration changes
  ansible.builtin.meta: flush_handlers

- name: Test the direct connection to the Splunk receiver
  ansible.windows.win_wait_for:
    host: "{{ splunk_uf_receiver_host }}"
    port: "{{ splunk_uf_receiver_port }}"
    timeout: 10
  register: splunk_uf_receiver_test
  failed_when: >-
    (splunk_uf_require_receiver | bool) and
    (splunk_uf_receiver_test.failed | default(false))

- name: Show manual recovery information
  ansible.builtin.debug:
    msg:
      - "Splunk UF service : {{ splunk_uf_service_name }} (LocalSystem)"
      - "Splunk local user : {{ splunk_uf_admin_user }}"
      - "Splunk local pass : supplied through GOAD_SPLUNK_UF_PASSWORD (not displayed)"
      - "Direct receiver   : {{ splunk_uf_receiver_host }}:{{ splunk_uf_receiver_port }}"
      - "Configuration     : {{ splunk_uf_app_local_dir }}"
