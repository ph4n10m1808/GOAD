- name: Resolve the absolute controller ISO cache path
  ansible.builtin.set_fact:
    exchange_iso_cache_path: "{{ [playbook_dir, ludus_install_directory, 'resources', 'iso', ludus_exchange_iso_url.split('/') | last] | path_join }}"

- name: Get Exchange ISO if needed
  run_once: true
  block:
    - name: "Create {{ ludus_install_directory }}/resources/iso directory if it doesn't exist"
      ansible.builtin.file:
        path: "{{ exchange_iso_cache_path | dirname }}"
        state: directory
        recurse: true
      delegate_to: localhost

    - name: Check if Exchange ISO exists
      ansible.builtin.stat:
        path: "{{ exchange_iso_cache_path }}"
        get_checksum: false
      delegate_to: localhost
      register: exchange_iso_check

    - name: Downloading EXCHANGE ISO - This will take a while
      ansible.builtin.get_url:
        url: "{{ ludus_exchange_iso_url }}"
        dest: "{{ exchange_iso_cache_path }}"
        mode: "660"
      delegate_to: localhost
      when: not exchange_iso_check.stat.exists

- name: create EXCHANGE folder
  ansible.windows.win_file:
    path: "{{ ludus_exchange_iso_directory }}"
    state: directory

- name: Check if EXCHANGE ISO exists on host
  ansible.windows.win_stat:
    path: "{{ ludus_exchange_iso_directory }}\\{{ ludus_exchange_iso_url.split('/') | last }}"
    checksum_algorithm: sha256
  register: exchange_iso_host_check

- name: Calculate checksum of the complete publisher ISO cache
  ansible.builtin.stat:
    path: "{{ exchange_iso_cache_path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  register: exchange_iso_verified_cache

- name: Require a regular nonempty controller ISO cache
  ansible.builtin.assert:
    that:
      - exchange_iso_verified_cache.stat.isreg | default(false)
      - exchange_iso_verified_cache.stat.size | default(0) > 0
      - exchange_iso_verified_cache.stat.checksum is defined
    fail_msg: Controller Exchange ISO cache is not a regular nonempty file with a calculated SHA-256

- name: Copy the existing controller ISO only when the Windows copy differs
  ansible.windows.win_copy:
    src: "{{ exchange_iso_cache_path }}"
    dest: "{{ ludus_exchange_iso_directory }}\\{{ ludus_exchange_iso_url.split('/') | last }}"
    remote_src: false
    force: true
    backup: false
    decrypt: false
  when: >-
    not exchange_iso_host_check.stat.exists or
    (exchange_iso_host_check.stat.checksum | default('')) != exchange_iso_verified_cache.stat.checksum

- name: Read the Windows ISO checksum before mounting or installing
  ansible.windows.win_stat:
    path: "{{ ludus_exchange_iso_directory }}\\{{ ludus_exchange_iso_url.split('/') | last }}"
    checksum_algorithm: sha256
  register: exchange_iso_host_verified

- name: Require the Windows ISO to match the controller cache exactly
  ansible.builtin.assert:
    that:
      - exchange_iso_host_verified.stat.isreg | default(false)
      - exchange_iso_host_verified.stat.size | default(0) == exchange_iso_verified_cache.stat.size
      - exchange_iso_host_verified.stat.checksum | default('') == exchange_iso_verified_cache.stat.checksum
    fail_msg: Windows Exchange ISO does not match the controller cache; do not mount or install it
