---
- name: Prepare the Exchange working directory independently of ISO delivery
  ansible.windows.win_file:
    path: "{{ ludus_exchange_iso_directory }}"
    state: directory

- name: Check if pre-req installation is completed
  win_stat:
    path: "{{ exchange_prereqs_complete_file }}"
  register: prereq_check

- block:
    - name: Install IIS 6 Compatibility Features
      win_feature:
        name:
          - Server-Media-Foundation
          - NET-Framework-45-Features
          - RPC-over-HTTP-proxy
          - RSAT-Clustering
          - RSAT-Clustering-CmdInterface
          - RSAT-Clustering-Mgmt
          - RSAT-Clustering-PowerShell
          - WAS-Process-Model
          - Web-Asp-Net45
          - Web-Basic-Auth
          - Web-Client-Auth
          - Web-Digest-Auth
          - Web-Dir-Browsing
          - Web-Dyn-Compression
          - Web-Http-Errors
          - Web-Http-Logging
          - Web-Http-Redirect
          - Web-Http-Tracing
          - Web-ISAPI-Ext
          - Web-ISAPI-Filter
          - Web-Lgcy-Mgmt-Console
          - Web-Metabase
          - Web-Mgmt-Console
          - Web-Mgmt-Service
          - Web-Net-Ext45
          - Web-Request-Monitor
          - Web-Server
          - Web-Stat-Compression
          - Web-Static-Content
          - Web-Windows-Auth
          - Web-WMI
          - Windows-Identity-Foundation
          - RSAT-ADDS
          - ADLDS
        state: present

    - name: Enable Windows optional features
      win_optional_feature:
        name:
          - IIS-IIS6ManagementCompatibility
          - IIS-Metabase
        state: present

    - name: Download .NET Framework 4.8 installer
      ansible.windows.win_get_url:
        url: "{{ exchange_dotnet_install_path }}"
        dest: "{{ ludus_exchange_iso_directory }}\\ndp48-x86-x64-allos-enu.exe"
        checksum: "{{ exchange_dotnet_sha256 | default(omit, true) }}"
        checksum_algorithm: sha256
        force: false

    - name: Install .NET Framework
      win_package:
        path: "{{ ludus_exchange_iso_directory }}\\ndp48-x86-x64-allos-enu.exe"
        arguments: /q /norestart
        state: present
      register: dotnet_install

    - name: Reboot after installing .NET Framework 4.8
      win_reboot:
      when: dotnet_install.reboot_required | default(false)  # 3010 means a reboot is required

    - name: Wait for the machine to be up after reboot
      wait_for_connection:
        timeout: 300

    - name: Download Visual C++ Redistributable 2012 installer
      ansible.windows.win_get_url:
        url: "{{ vcredist2012_install_path }}"
        dest: "{{ ludus_exchange_iso_directory }}\\vcredist2012_x64.exe"
        checksum: "{{ vcredist2012_sha256 | default(omit, true) }}"
        checksum_algorithm: sha256
        force: false

    - name: Install Visual C++ Redistributable for Visual Studio 2012
      ansible.windows.win_package:
        path: "{{ ludus_exchange_iso_directory }}\\vcredist2012_x64.exe"
        # Burn wrappers can exit while an elevated child still holds the EXE.
        wait_for_children: true
        arguments: /quiet /norestart
        state: present
      register: vcredist2012_install

    - name: Reboot if Visual C++ 2012 requires it
      ansible.windows.win_reboot:
        reboot_timeout: 1200
      when: vcredist2012_install.reboot_required | default(false)

    - name: Download Visual C++ Redistributable 2013 installer
      ansible.windows.win_get_url:
        url: "{{ vcredist2013_install_path }}"
        dest: "{{ ludus_exchange_iso_directory }}\\vcredist2013_x64.exe"
        checksum: "{{ vcredist2013_sha256 | default(omit, true) }}"
        checksum_algorithm: sha256
        force: false

    - name: Install Visual C++ Redistributable for Visual Studio 2013
      win_package:
        path: "{{ ludus_exchange_iso_directory }}\\vcredist2013_x64.exe"
        # Burn wrappers can exit while an elevated child still holds the EXE.
        wait_for_children: true
        arguments: /q /norestart
        state: present
      register: vcredist2013_install

    - name: Reboot after installing Visual C++ Redistributable for Visual Studio 2013
      win_reboot:
      when: vcredist2013_install.changed

    - name: Download IIS URL Rewrite Module installer
      ansible.windows.win_get_url:
        url: "{{ rewrite_module_path }}"
        dest: "{{ ludus_exchange_iso_directory }}\\rewrite_amd64_en-US.msi"
        checksum: "{{ rewrite_module_sha256 | default(omit, true) }}"
        checksum_algorithm: sha256
        force: false

    - name: The IIS URL Rewrite Module is required with Exchange Server 2016 CU22 and Exchange Server 2019 CU11 or later
      win_package:
        path: "{{ ludus_exchange_iso_directory }}\\rewrite_amd64_en-US.msi"
        arguments: /q /norestart
        state: present

    - name: Download Unified Communications Managed API 4.0 Runtime installer
      ansible.windows.win_get_url:
        url: "{{ ucma_runtime_path }}"
        dest: "{{ ludus_exchange_iso_directory }}\\UcmaRuntimeSetup.exe"
        checksum: "{{ ucma_runtime_sha256 | default(omit, true) }}"
        checksum_algorithm: sha256
        force: false

    - name: Install Unified Communications Managed API 4.0 Runtime.
      win_package:
        path: "{{ ludus_exchange_iso_directory }}\\UcmaRuntimeSetup.exe"
        arguments: /q /norestart
        product_id: UCMA4
        state: present
      register: pri_exchange_ucma_install

    - name: reboot after installing Unified Communications Managed API 4.0 Runtime
      win_reboot:
      when: pri_exchange_ucma_install.reboot_required

    - name: Wait for the machine to be up after reboot
      wait_for_connection:
        timeout: 300

    - name: Install Windows features ADLDS Exchange Transport Hub
      win_feature:
        name:
          - ADLDS
        state: present

    - name: Reboot the system
      win_reboot:
        reboot_timeout: 1200

    - name: Wait for the machine to be up after reboot
      wait_for_connection:
        timeout: 300

    - name: Create file marker after successful pre-req installation and reboot
      ansible.windows.win_file:
        path: "{{ exchange_prereqs_complete_file }}"
        state: touch

  when: not prereq_check.stat.exists

- name: Check if pre-req installation is already completed
  debug:
    msg: "Pre-req installation is already completed. Skipping Pre-req installation tasks."
  when: prereq_check.stat.exists
