---
- name: "Read data files"
  hosts: domain:linux_domain:extensions
  connection: local
  vars_files:
    - "{{data_path}}/config.json"
  tasks:
    - name: save the Json data to a Variable as a Fact
      set_fact:
        lab: "{{lab}}"
        cacheable: yes
      run_once: true

    # Windows setup facts expose interface dictionaries. Linux setup facts use
    # interface-name strings, and no Linux role consumes these adapter facts.
    - name: classify Windows network adapters
      when: ansible_os_family == 'Windows'
      block:
        - name: reset per-host adapter classification
          set_fact:
            domain_adapter: null
            nat_adapter: null
            soc_adapter: null

        - name: find domain_adapter
          set_fact:
            domain_adapter: "{{ item.connection_name }}"
          when: item.ipv4.address == hostvars[dict_key].ansible_host
          loop: "{{ ansible_interfaces }}"

        - name: find the dedicated GOAD-Light SOC adapter
          set_fact:
            soc_adapter: "{{ item.connection_name }}"
          when:
            - item.ipv4.address in ['192.168.50.20', '192.168.50.21', '192.168.50.22']
            - item.default_gateway | default('') == '192.168.50.1'
          loop: "{{ ansible_interfaces }}"

        - name: find nat_adapter from the non-lab default gateway
          set_fact:
            nat_adapter: "{{ item.connection_name }}"
          when:
            - item.ipv4.address != hostvars[dict_key].ansible_host
            - item.default_gateway is defined
            - item.default_gateway is not none
            - item.default_gateway | string | length > 0
            - item.default_gateway != (hostvars[dict_key].ansible_host | regex_replace('\.[0-9]+$', '.1'))
            - soc_adapter is none or item.connection_name != soc_adapter
          loop: "{{ ansible_interfaces }}"

        - name: find number of interfaces
          set_fact:
            number_of_interfaces: "{{ ansible_interfaces | length }}"

        - name: find if two adapters
          set_fact:
            two_adapters: "{{ (number_of_interfaces | int) > 1 }}"

        - name: use the domain adapter when no distinct NAT adapter exists
          set_fact:
            nat_adapter: "{{ domain_adapter }}"
          when: nat_adapter is none

        - name: validate deterministic adapter classification
          assert:
            that:
              - domain_adapter is not none
              - nat_adapter is not none
              - soc_adapter is none or soc_adapter not in [domain_adapter, nat_adapter]
            fail_msg: >-
              Unable to classify the domain, NAT and SOC adapters safely.
              Refusing to continue with DNS, routing or interface tasks.

