---
# Load datas
- import_playbook: data.yml
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: Validate member domain trust before privileged vulnerability tasks
  hosts: server:workstation
  roles:
    - role: domain_secure_channel
  vars:
    member_domain: "{{ lab.hosts[dict_key].domain }}"
    domain_username: "{{ admin_user }}@{{ member_domain }}"
    domain_password: "{{ lab.domains[member_domain].domain_password }}"

- name: "Setup vulnerabilities with tasks"
  hosts: domain
  tasks:
    - include_role:
        name: "vulns/{{vuln}}"
      vars:
        vulns_vars : "{{ lab.hosts[dict_key].vulns_vars[vuln] | default({}) }}"
        domain: "{{lab.hosts[dict_key].domain}}"
        domain_username: "{{domain}}\\{{admin_user}}"
        domain_password: "{{lab.domains[domain].domain_password}}"
      loop: "{{lab.hosts[dict_key].vulns | default([]) }}"
      loop_control:
        loop_var: vuln

    - include_role:
        name: "ps"
      vars:
        script_path: "../ad/{{domain_name}}/scripts"
        ps_script: "{{script_path}}/{{item}}"
      loop: "{{lab.hosts[dict_key].scripts | default([]) }}"

  post_tasks:
    - name: Prepare explicitly selected legacy AD lab conditions
      ansible.builtin.include_role:
        name: settings/legacy_ad_lab
      when: inventory_hostname in groups.get('legacy_ad_lab', [])

    - name: Enable selected native lab logs without installing monitoring software
      ansible.builtin.include_role:
        name: settings/lab_auditing
      when: inventory_hostname in groups.get('lab_auditing', [])

    - name: Prepare unprivileged SOC identities on the selected root domain controller
      ansible.builtin.include_role:
        name: settings/soc_accounts
      when: domain_name == 'GOAD-Light' and inventory_hostname in groups.get('parent_dc', []) and inventory_hostname in groups.get('lab_auditing', [])

    - name: Disable Windows Update after successful Windows lab provisioning
      ansible.builtin.include_role:
        name: settings/no_updates
      when: inventory_hostname in groups.get('no_update_after_install', [])

- name: "Setup vulnerabilities with tasks"
  hosts: linux_domain
  become: true
  tasks:
    - include_role:
        name: "ps"
      vars:
        script_path: "../ad/{{domain_name}}/scripts"
        ps_script: "{{script_path}}/{{item}}"
      loop: "{{lab.hosts[dict_key].scripts | default([]) }}"
