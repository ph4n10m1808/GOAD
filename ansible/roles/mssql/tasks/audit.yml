- name: Enable SQL Server security events in the Windows Application log
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $instance = '{{ sql_instance_name }}'
      $pipe = if ($instance -eq 'MSSQLSERVER') { 'np:\\.\pipe\sql\query' } else { 'np:\\.\pipe\MSSQL$' + $instance + '\sql\query' }
      $auditSql = @'
      SET NOCOUNT ON;
      IF EXISTS (
        SELECT 1 FROM sys.server_audits
        WHERE name = N'SOC_SQL_SECURITY_AUDIT'
          AND type_desc <> N'APPLICATION LOG'
      )
      BEGIN
        ;THROW 51000, 'SOC SQL audit exists with a different target', 1;
      END;

      IF NOT EXISTS (
        SELECT 1 FROM sys.server_audits
        WHERE name = N'SOC_SQL_SECURITY_AUDIT'
      )
        CREATE SERVER AUDIT [SOC_SQL_SECURITY_AUDIT]
        TO APPLICATION_LOG
        WITH (QUEUE_DELAY = 1000, ON_FAILURE = CONTINUE);

      IF EXISTS (
        SELECT 1 FROM sys.server_audit_specifications s
        WHERE s.name = N'SOC_SQL_SECURITY_AUDIT_SPEC'
          AND s.audit_guid <> (
            SELECT a.audit_guid FROM sys.server_audits a
            WHERE a.name = N'SOC_SQL_SECURITY_AUDIT'
          )
      )
      BEGIN
        ;THROW 51001, 'SOC SQL audit specification points to another audit', 1;
      END;

      IF NOT EXISTS (
        SELECT 1 FROM sys.server_audit_specifications
        WHERE name = N'SOC_SQL_SECURITY_AUDIT_SPEC'
      )
      BEGIN
        CREATE SERVER AUDIT SPECIFICATION [SOC_SQL_SECURITY_AUDIT_SPEC]
        FOR SERVER AUDIT [SOC_SQL_SECURITY_AUDIT]
          ADD (FAILED_LOGIN_GROUP),
          ADD (SUCCESSFUL_LOGIN_GROUP),
          ADD (SERVER_ROLE_MEMBER_CHANGE_GROUP),
          ADD (SERVER_PRINCIPAL_CHANGE_GROUP),
          ADD (SERVER_PRINCIPAL_IMPERSONATION_GROUP),
          ADD (DATABASE_PRINCIPAL_CHANGE_GROUP),
          ADD (DATABASE_PRINCIPAL_IMPERSONATION_GROUP),
          ADD (DATABASE_ROLE_MEMBER_CHANGE_GROUP),
          ADD (SERVER_PERMISSION_CHANGE_GROUP),
          ADD (DATABASE_PERMISSION_CHANGE_GROUP),
          ADD (AUDIT_CHANGE_GROUP);
      END;

      -- Extend an existing owned specification, preserving its other actions.
      DECLARE @addImpersonation nvarchar(max) = N'';
      SELECT @addImpersonation = @addImpersonation +
        N'ALTER SERVER AUDIT SPECIFICATION [SOC_SQL_SECURITY_AUDIT_SPEC] ADD (' + required.audit_action_name + N');'
      FROM (VALUES (N'SERVER_PRINCIPAL_IMPERSONATION_GROUP'),
                   (N'DATABASE_PRINCIPAL_IMPERSONATION_GROUP')) required(audit_action_name)
      WHERE NOT EXISTS (
        SELECT 1 FROM sys.server_audit_specifications s
        JOIN sys.server_audit_specification_details d ON d.server_specification_id = s.server_specification_id
        WHERE s.name = N'SOC_SQL_SECURITY_AUDIT_SPEC' AND d.audit_action_name = required.audit_action_name
      );
      IF @addImpersonation <> N''
      BEGIN
        ALTER SERVER AUDIT SPECIFICATION [SOC_SQL_SECURITY_AUDIT_SPEC] WITH (STATE = OFF);
        BEGIN TRY
          EXEC sys.sp_executesql @addImpersonation;
          ALTER SERVER AUDIT SPECIFICATION [SOC_SQL_SECURITY_AUDIT_SPEC] WITH (STATE = ON);
        END TRY
        BEGIN CATCH
          ALTER SERVER AUDIT SPECIFICATION [SOC_SQL_SECURITY_AUDIT_SPEC] WITH (STATE = ON);
          THROW;
        END CATCH;
      END;

      IF EXISTS (
        SELECT 1 FROM sys.server_audit_specifications s
        WHERE s.name = N'SOC_SQL_SECURITY_AUDIT_SPEC'
          AND EXISTS (
            SELECT required.audit_action_name
            FROM (VALUES
              (N'FAILED_LOGIN_GROUP'),
              (N'SUCCESSFUL_LOGIN_GROUP'),
              (N'SERVER_ROLE_MEMBER_CHANGE_GROUP'),
              (N'SERVER_PRINCIPAL_CHANGE_GROUP'),
              (N'SERVER_PRINCIPAL_IMPERSONATION_GROUP'),
              (N'DATABASE_PRINCIPAL_CHANGE_GROUP'),
              (N'DATABASE_PRINCIPAL_IMPERSONATION_GROUP'),
              (N'DATABASE_ROLE_MEMBER_CHANGE_GROUP'),
              (N'SERVER_PERMISSION_CHANGE_GROUP'),
              (N'DATABASE_PERMISSION_CHANGE_GROUP'),
              (N'AUDIT_CHANGE_GROUP')
            ) required(audit_action_name)
            WHERE NOT EXISTS (
              SELECT 1 FROM sys.server_audit_specification_details d
              WHERE d.server_specification_id = s.server_specification_id
                AND d.audit_action_name = required.audit_action_name
            )
          )
      )
      BEGIN
        ;THROW 51002, 'SOC SQL audit specification is enabled but incomplete', 1;
      END;

      IF EXISTS (
        SELECT 1 FROM sys.server_audits
        WHERE name = N'SOC_SQL_SECURITY_AUDIT' AND is_state_enabled = 0
      ) ALTER SERVER AUDIT [SOC_SQL_SECURITY_AUDIT] WITH (STATE = ON);

      IF EXISTS (
        SELECT 1 FROM sys.server_audit_specifications
        WHERE name = N'SOC_SQL_SECURITY_AUDIT_SPEC' AND is_state_enabled = 0
      ) ALTER SERVER AUDIT SPECIFICATION [SOC_SQL_SECURITY_AUDIT_SPEC] WITH (STATE = ON);

      IF NOT EXISTS (
        SELECT 1
        FROM sys.server_audits a
        JOIN sys.server_audit_specifications s ON s.audit_guid = a.audit_guid
        WHERE a.name = N'SOC_SQL_SECURITY_AUDIT'
          AND a.type_desc = N'APPLICATION LOG'
          AND a.is_state_enabled = 1
          AND s.name = N'SOC_SQL_SECURITY_AUDIT_SPEC'
          AND s.is_state_enabled = 1
      )
      BEGIN
        ;THROW 51003, 'SOC SQL audit verification failed', 1;
      END;
      '@

      $beforeSql = @'
      SET NOCOUNT ON;
      SELECT CAST(a.is_state_enabled AS int), a.type_desc,
             CAST(s.is_state_enabled AS int), COUNT(d.audit_action_name)
      FROM sys.server_audits a
      JOIN sys.server_audit_specifications s ON s.audit_guid = a.audit_guid
      LEFT JOIN sys.server_audit_specification_details d
        ON d.server_specification_id = s.server_specification_id
      WHERE a.name = N'SOC_SQL_SECURITY_AUDIT'
        AND s.name = N'SOC_SQL_SECURITY_AUDIT_SPEC'
      GROUP BY a.is_state_enabled, a.type_desc, s.is_state_enabled;
      '@

      $before = (& sqlcmd -S $pipe -E -b -h -1 -W -s '|' -Q $beforeSql | Out-String).Trim()
      if ($LASTEXITCODE -ne 0) { throw 'Could not read SQL audit state before apply' }

      $applyOutput = (& sqlcmd -S $pipe -E -b -Q $auditSql | Out-String).Trim()
      if ($LASTEXITCODE -ne 0) {
        throw ("SQL Server security audit apply failed: " + $applyOutput)
      }

      $verifySql = @'
      SET NOCOUNT ON;
      SELECT CAST(a.is_state_enabled AS int), a.type_desc,
             CAST(s.is_state_enabled AS int), COUNT(d.audit_action_name)
      FROM sys.server_audits a
      JOIN sys.server_audit_specifications s ON s.audit_guid = a.audit_guid
      LEFT JOIN sys.server_audit_specification_details d
        ON d.server_specification_id = s.server_specification_id
      WHERE a.name = N'SOC_SQL_SECURITY_AUDIT'
        AND s.name = N'SOC_SQL_SECURITY_AUDIT_SPEC'
      GROUP BY a.is_state_enabled, a.type_desc, s.is_state_enabled;
      '@

      $after = (& sqlcmd -S $pipe -E -b -h -1 -W -s '|' -Q $verifySql | Out-String).Trim()
      if ($LASTEXITCODE -ne 0 -or -not ($after -match '^1\|APPLICATION LOG\|1\|(\d+)$') -or [int]$Matches[1] -lt 11) {
        throw 'SQL Server security audit is not enabled with the expected target and eleven required server actions'
      }

      # SQL2019 supports BATCH_COMPLETED_GROUP at database scope, not server scope.
      # SECURITY NOTE (lab-only): BATCH_COMPLETED_GROUP logs full SQL batch text to
      # the Windows Application log (forwarded to SIEM), which may include literal
      # credentials or secrets embedded in SQL statements. Set
      # mssql_audit_batch_completed=false to keep only server-level security audits.
      $enableBatchAudit = {{ (mssql_audit_batch_completed | default(true) | bool) | ternary('$true', '$false') }}
      $batchOutput = ''
      if ($enableBatchAudit) {
      $databaseAuditSql = @'
      SET NOCOUNT ON;
      DECLARE @db sysname, @statement nvarchar(max);
      DECLARE audit_databases CURSOR LOCAL FAST_FORWARD FOR
        SELECT name FROM sys.databases
        WHERE (database_id = 1 OR database_id > 4) AND state = 0
          AND is_read_only = 0 AND source_database_id IS NULL;
      OPEN audit_databases;
      FETCH NEXT FROM audit_databases INTO @db;
      WHILE @@FETCH_STATUS = 0
      BEGIN
        SET @statement = N'USE ' + QUOTENAME(@db) + N';
        IF EXISTS (SELECT 1 FROM sys.database_audit_specifications
          WHERE name=N''SOC_SQL_BATCH_AUDIT_SPEC'' AND audit_guid <>
            (SELECT audit_guid FROM sys.server_audits WHERE name=N''SOC_SQL_SECURITY_AUDIT''))
          THROW 51004, ''SOC database specification belongs to another audit'', 1;
        IF NOT EXISTS (SELECT 1 FROM sys.database_audit_specifications
          WHERE name=N''SOC_SQL_BATCH_AUDIT_SPEC'')
        BEGIN
          CREATE DATABASE AUDIT SPECIFICATION [SOC_SQL_BATCH_AUDIT_SPEC]
          FOR SERVER AUDIT [SOC_SQL_SECURITY_AUDIT] ADD (BATCH_COMPLETED_GROUP) WITH (STATE=ON);
          PRINT ''SOC_AUDIT_CHANGED'';
        END;
        IF EXISTS (SELECT 1 FROM sys.database_audit_specifications
          WHERE name=N''SOC_SQL_BATCH_AUDIT_SPEC'' AND is_state_enabled=0)
        BEGIN
          ALTER DATABASE AUDIT SPECIFICATION [SOC_SQL_BATCH_AUDIT_SPEC] WITH (STATE=ON);
          PRINT ''SOC_AUDIT_CHANGED'';
        END;
        IF NOT EXISTS (SELECT 1 FROM sys.database_audit_specifications s
          JOIN sys.database_audit_specification_details d
            ON d.database_specification_id=s.database_specification_id
          WHERE s.name=N''SOC_SQL_BATCH_AUDIT_SPEC'' AND s.is_state_enabled=1
            AND d.audit_action_name=N''BATCH_COMPLETED_GROUP'')
          THROW 51005, ''Database batch audit verification failed'', 1;';
        EXEC sys.sp_executesql @statement;
        FETCH NEXT FROM audit_databases INTO @db;
      END;
      CLOSE audit_databases; DEALLOCATE audit_databases;
      '@
      $batchOutput = (& sqlcmd -S $pipe -E -b -Q $databaseAuditSql | Out-String).Trim()
      if ($LASTEXITCODE -ne 0) { throw ('SQL database batch audit failed: ' + $batchOutput) }
      }

      $Ansible.Changed = ($before.Trim() -ne $after -or $batchOutput -match 'SOC_AUDIT_CHANGED')
      $Ansible.Result = @{
        instance = $instance
        target = 'APPLICATION_LOG'
        audit_enabled = $true
        specification_enabled = $true
        required_server_action_groups = 11
        batch_completed_audit_enabled = $enableBatchAudit
        statement_audit_scope = if ($enableBatchAudit) { 'master and online writable user databases; tempdb/model/msdb excluded' } else { 'disabled (server-level security audit only)' }
      }
  become: yes
  become_method: runas
  become_user: "{{ SQLSVCACCOUNT }}"
  vars:
    ansible_become_pass: "{{ SQLSVCPASSWORD }}"
