- name: "disable the registration of the {{nat_adapter}} interface (NAT address) in DNS"
  ansible.windows.win_shell: Get-NetAdapter '{{nat_adapter}}' | Set-DNSClient -RegisterThisConnectionsAddress $False
  when: two_adapters

- name: "Set configure dns to {{dns_domain}}"
  ansible.windows.win_dns_client:
    # DC Locator does not honor an explicit -Server argument. If the NAT and
    # private adapters have equal metrics, Windows can query libvirt DNS and
    # return ERROR_NO_SUCH_DOMAIN even though the parent SRV record is valid.
    adapter_names: "{{ [domain_adapter, nat_adapter] | unique | list }}"
    dns_servers:
      - "{{hostvars[dns_domain].ansible_host}}"
    log_path: C:\dns_log.txt

- name: Install windows features - AD Domain Services
  win_feature:
    name: AD-Domain-Services
    state: present
    include_management_tools: yes
  register: features

- name: Install windows features - RSAT-ADDS
  win_feature:
    name: RSAT-ADDS
    state: present
    include_management_tools: yes
  register: features

- name: Wait for the parent domain controller DNS service
  ansible.windows.win_wait_for:
    host: "{{ master_server }}"
    port: 53
    timeout: 300

- name: Wait for the parent domain controller AD ports
  ansible.windows.win_wait_for:
    host: "{{ master_server }}"
    port: "{{ item }}"
    timeout: 300
  loop:
    - 88
    - 135
    - 389
    - 445

- name: Verify the parent domain controller locator SRV record
  ansible.windows.win_shell: >-
    Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.{{ parent_domain }}"
    -Type SRV -Server "{{ master_server }}" -ErrorAction Stop
  register: parent_dc_locator_dns
  changed_when: false
  until: parent_dc_locator_dns.rc == 0
  retries: 30
  delay: 10

- name: Verify Windows DC Locator can discover the parent domain
  ansible.windows.win_command: nltest.exe /dsgetdc:{{ parent_domain }} /force
  register: parent_dc_locator
  changed_when: false
  until: parent_dc_locator.rc == 0
  retries: 12
  delay: 10

# DNSCHANGE
