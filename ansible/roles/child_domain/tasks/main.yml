- name: Enable only the {{domain_adapter}} interface (local) for DNS client requests
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $IPAddress
      )

      $settings = Get-DnsServerSetting -All
      $listenAddresses = @($settings.ListeningIPAddress | ForEach-Object { $_.ToString() })

      if ($listenAddresses.Count -eq 1 -and $listenAddresses[0] -eq $IPAddress) {
          $Ansible.Changed = $false
      } else {
          $settings.ListeningIPAddress = @($IPAddress)
          Set-DnsServerSetting -InputObject $settings -Force
          $Ansible.Changed = $true
      }
    parameters:
      IPAddress: "{{ hostvars[dict_key].ansible_host }}"
  when: two_adapters

# add external dns forwarder
- name: Configure DNS Forwarders
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $IPAddress
      )

      $forwarder = Get-DnsServerForwarder
      $forwarderAddresses = @($forwarder.IPAddress | ForEach-Object { $_.ToString() })

      if ($forwarderAddresses.Count -eq 1 -and
          $forwarderAddresses[0] -eq $IPAddress -and
          $forwarder.UseRootHint -eq $false) {
          $Ansible.Changed = $false
      } else {
          Set-DnsServerForwarder -IPAddress @($IPAddress) -UseRootHint $false
          $Ansible.Changed = $true
      }
    parameters:
      IPAddress: "{{ dns_server_forwarder }}"

# issue 156
- name: enable the Active directory web services if not enabled
  ansible.windows.win_shell: Set-Service -Name adws -StartupType Automatic
