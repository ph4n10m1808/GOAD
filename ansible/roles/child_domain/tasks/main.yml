- name: add child domain to parent domain
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $Password,

          [String]
          $DomainAdmin,

          [String]
          $ParentDomainName,

          [String]
          $NewDomainNetbiosName,

          [String]
          $ReplicationSourceDC,

          [String]
          $NewDomainName,

          [String]
          $ChildDomainFqdn,

          [String]
          $DomSafePassword
      )
      # Determine idempotency from the local machine state. Get-ADDomain is not
      # reliable before promotion because ADWS is not running yet and raises
      # ADServerDownException rather than ADIdentityNotFoundException.
      $computerSystem = Get-CimInstance Win32_ComputerSystem
      if ($computerSystem.PartOfDomain) {
        if ($computerSystem.Domain -ine $ChildDomainFqdn) {
          throw "Machine already belongs to unexpected domain '$($computerSystem.Domain)'"
        }
        $Ansible.Changed = $false
      } else {
        $Ansible.Changed = $true
        $pass = ConvertTo-SecureString $Password -AsPlainText -Force
        $Cred = New-Object System.Management.Automation.PSCredential ($DomainAdmin, $pass)
        $safePassword = ConvertTo-SecureString $DomSafePassword -AsPlainText -Force
        Install-ADDSDomain -Credential $Cred -SkipPreChecks -NewDomainName $NewDomainName -NewDomainNetbiosName $NewDomainNetbiosName -ParentDomainName $ParentDomainName -ReplicationSourceDC $ReplicationSourceDC -DatabasePath "C:\Windows\NTDS" -SYSVOLPath "C:\Windows\SYSVOL" -LogPath "C:\Windows\Logs" -SafeModeAdministratorPassword $safePassword -Force -NoRebootOnCompletion
      }
    parameters:
      Password: "{{parent_domain_password}}"
      DomSafePassword: "{{domain_password}}"
      DomainAdmin: "{{parent_domain_user}}"
      ParentDomainName: "{{parent_domain}}"
      ReplicationSourceDC: "{{source_dc}}"
      NewDomainNetbiosName: "{{netbios_name}}"
      NewDomainName: "{{domain.split('.')[0]}}"
      ChildDomainFqdn: "{{domain}}"
  register: child_result

- name: Reboot
  win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 100
  when: child_result.changed

- name: Verify child domain promotion completed
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param ([String] $DomainName)

      $computerSystem = Get-CimInstance Win32_ComputerSystem
      if (-not $computerSystem.PartOfDomain -or $computerSystem.Domain -ine $DomainName) {
        throw "Child domain promotion is incomplete: local domain is '$($computerSystem.Domain)'"
      }

      $ntds = Get-Service NTDS -ErrorAction Stop
      if ($ntds.Status -ne 'Running') {
        throw "Child domain promotion is incomplete: NTDS is $($ntds.Status)"
      }

      Resolve-DnsName -Name $DomainName -Type SOA -Server 127.0.0.1 -ErrorAction Stop | Out-Null
      $Ansible.Changed = $false
    parameters:
      DomainName: "{{ domain }}"
  register: child_domain_health
  until: child_domain_health is succeeded
  retries: 30
  delay: 10

- name: Configure the child domain controller to prefer its own DNS service
  ansible.windows.win_dns_client:
    adapter_names: "{{ [domain_adapter, nat_adapter] | unique | list }}"
    dns_servers:
      - "{{ hostvars[dict_key].ansible_host }}"
      - "{{ master_server }}"

- name: Be sure DNS feature and management tools are installed
  ansible.windows.win_feature:
    name: DNS
    state: present
    include_management_tools: true

