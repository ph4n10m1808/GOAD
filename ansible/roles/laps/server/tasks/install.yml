---
- name: Download LAPS installer for member servers
  ansible.windows.win_get_url:
    url: "{{ laps_msi_url | default('https://download.microsoft.com/download/C/7/A/C7AAD914-A8A6-4904-88A1-29E657445D03/LAPS.x64.msi') }}"
    dest: 'C:\Windows\Temp\LAPS.x64.msi'
    checksum: "{{ laps_msi_sha256 | default(omit, true) }}"
    checksum_algorithm: sha256
    force: false
  register: pri_laps_download
  until: pri_laps_download is success
  retries: 3
  delay: 1

- name: Verify Microsoft Authenticode signature on downloaded LAPS installer
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $sig = Get-AuthenticodeSignature -FilePath 'C:\Windows\Temp\LAPS.x64.msi'
      if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') {
          throw "LAPS.x64.msi Authenticode verification failed: status=$($sig.Status)"
      }
    error_action: stop

- name: Install to Servers
  ansible.windows.win_package:
    arguments: "ADDLOCAL=CSE"
    path: 'C:\Windows\Temp\LAPS.x64.msi'
    state: present
    creates_path: "%ProgramFiles%\\LAPS\\CSE\\AdmPwd.dll"
  register: pri_laps_install
  until: pri_laps_install is success
  retries: 3
  delay: 1

- name: reboot after installing LAPS if required
  ansible.windows.win_reboot:
  when: pri_laps_install.reboot_required

- name: Refresh GPO on the Clients
  ansible.windows.win_command: gpupdate /target:computer /force /wait:600

- name: Verify the native LAPS client and preserve provisioning account access
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param([string]$ProvisioningUser)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4) {
          throw 'Legacy LAPS CSE must not manage a domain controller'
      }
      $policy = Get-ItemProperty 'HKLM:\Software\Policies\Microsoft Services\AdmPwd'
      if ($policy.AdmPwdEnabled -ne 1) { throw 'Legacy LAPS computer policy is not enabled' }
      $extension = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\GPExtensions\{D76B9641-3288-4f75-942D-087DE603E3EA}'
      if (-not (Test-Path ([Environment]::ExpandEnvironmentVariables($extension.DllName)))) {
          throw 'Legacy LAPS client extension is not registered correctly'
      }
      $administrator = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
      if (-not $administrator) {
          throw 'Built-in Administrator account (RID 500) was not found'
      }
      $provisionerName = if (-not [string]::IsNullOrWhiteSpace($ProvisioningUser)) {
          ($ProvisioningUser -split '[\\/]')[-1]
      } else { '' }
      if ($provisionerName) {
          $provisioner = Get-LocalUser -Name $provisionerName -ErrorAction SilentlyContinue
          if ($provisioner -and ($administrator.SID -eq $provisioner.SID -or -not $provisioner.Enabled)) {
              throw "LAPS account selection would invalidate the provisioning account ($provisionerName)"
          }
      }
      if (-not [string]::IsNullOrWhiteSpace($policy.AdminAccountName)) {
          throw 'Unexpected custom legacy LAPS account policy; review the selected account'
      }
      [pscustomobject]@{client_registered=$true;policy_enabled=$true;provisioning_account_preserved=$true}
    parameters:
      ProvisioningUser: "{{ laps_provisioning_user | default(ansible_user | default('vagrant')) }}"
