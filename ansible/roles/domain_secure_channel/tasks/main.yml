- name: Wait for the member domain controller
  ansible.windows.win_wait_for:
    host: "{{ hostvars[dns_domain].ansible_host }}"
    port: 445
    timeout: 300

- name: Check and repair the member secure channel
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String] $DomainName,
          [String] $DomainController,
          [String] $DomainUser,
          [SecureString] $DomainPassword
      )

      $computerSystem = Get-CimInstance Win32_ComputerSystem
      if (-not $computerSystem.PartOfDomain -or $computerSystem.Domain -ne $DomainName) {
          throw "$($computerSystem.Name) is not joined to the expected domain $DomainName"
      }

      if (Test-ComputerSecureChannel -Server $DomainController -ErrorAction SilentlyContinue) {
          $Ansible.Changed = $false
          return
      }

      $credential = New-Object System.Management.Automation.PSCredential(
          $DomainUser,
          $DomainPassword
      )

      $repaired = Test-ComputerSecureChannel `
          -Server $DomainController `
          -Credential $credential `
          -Repair `
          -ErrorAction Stop
      if (-not $repaired) {
          throw "Failed to repair the secure channel through $DomainController"
      }
      $Ansible.Changed = $true
    parameters:
      DomainName: "{{ member_domain }}"
      DomainController: "{{ lab.hosts[dns_domain].hostname }}.{{ member_domain }}"
      DomainUser: "{{ domain_username }}"
    sensitive_parameters:
      - name: DomainPassword
        value: "{{ domain_password }}"
  register: domain_secure_channel

- name: Reboot after repairing the member secure channel
  ansible.windows.win_reboot:
    reboot_timeout: 1500
    post_reboot_delay: 30
  when: domain_secure_channel.changed

- name: Verify the repaired member secure channel
  ansible.windows.win_powershell:
    script: |
      if (-not (Test-ComputerSecureChannel -ErrorAction SilentlyContinue)) {
          throw "The secure channel to {{ member_domain }} is not healthy"
      }
      $Ansible.Changed = $false
  register: domain_secure_channel_check
  retries: 6
  delay: 10
  until: domain_secure_channel_check is not failed

- name: Synchronize member time from the domain hierarchy
  ansible.windows.win_shell: |
    w32tm.exe /config /syncfromflags:domhier /update
    w32tm.exe /resync /rediscover
  register: domain_time_sync
  changed_when: false
  retries: 6
  delay: 10
  until: domain_time_sync.rc == 0
