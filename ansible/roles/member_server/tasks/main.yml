- name: "Set configure dns to {{dns_domain}}"
  win_dns_client:
    adapter_names: "{{domain_adapter}}"
    ipv4_addresses:
    - "{{hostvars[dns_domain].ansible_host}}"
    log_path: C:\dns_log.txt

- name: Wait for the domain controller DNS service
  ansible.windows.win_wait_for:
    host: "{{ hostvars[dns_domain].ansible_host }}"
    port: 53
    timeout: 300

- name: Verify that the member domain resolves through the domain controller
  ansible.windows.win_shell: >-
    Resolve-DnsName -Name "{{ member_domain }}"
    -Type SOA -Server "{{ hostvars[dns_domain].ansible_host }}"
  register: domain_dns_resolution
  changed_when: false
  until: domain_dns_resolution.rc == 0
  retries: 30
  delay: 10

- name: Verify File Server Role is installed.
  win_feature:
    name: File-Services, FS-FileServer
    state: present
    include_management_tools: True

- name: Repair an existing broken domain secure channel
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String] $DomainName,
          [String] $DomainController,
          [String] $DomainUser,
          [SecureString] $DomainPassword
      )

      $computerSystem = Get-CimInstance Win32_ComputerSystem
      if (-not $computerSystem.PartOfDomain -or $computerSystem.Domain -ne $DomainName) {
          $Ansible.Changed = $false
          return
      }

      if (Test-ComputerSecureChannel -Server $DomainController -ErrorAction SilentlyContinue) {
          $Ansible.Changed = $false
          return
      }

      $credential = New-Object System.Management.Automation.PSCredential(
          $DomainUser,
          $DomainPassword
      )
      $repaired = $false
      try {
          $repaired = Test-ComputerSecureChannel `
              -Server $DomainController `
              -Credential $credential `
              -Repair `
              -ErrorAction Stop
      } catch {}

      if (-not $repaired) {
          # Reset against the DC name so Netlogon/Kerberos can authenticate it.
          Reset-ComputerMachinePassword `
              -Server $DomainController `
              -Credential $credential `
              -ErrorAction Stop
          $repaired = $true
      }

      if (-not $repaired) {
          throw "Failed to repair the secure channel to $DomainName through $DomainController"
      }

      $Ansible.Changed = $true
    parameters:
      DomainName: "{{ member_domain }}"
      DomainController: "{{ lab.hosts[dns_domain].hostname }}.{{ member_domain }}"
      DomainUser: "{{ domain_username }}"
    sensitive_parameters:
      - name: DomainPassword
        value: "{{ domain_password }}"
  register: secure_channel_repair

- name: Reboot after repairing the domain secure channel
  ansible.windows.win_reboot:
    reboot_timeout: 1500
    post_reboot_delay: 30
  when: secure_channel_repair.changed

- name: Join the member domain without replaying an uncertain join
  block:
    - name: "Add member server"
      ansible.windows.win_domain_membership:
        dns_domain_name: "{{ member_domain }}"
        domain_admin_user: "{{ domain_username }}"
        domain_admin_password: "{{ domain_password }}"
        state: domain
      register: domain_state
  rescue:
    - name: Preserve real domain-join failures
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('Domain join failed') }}"
      when: >-
        not ((ansible_failed_result.msg | default('')) is
        search('RemoteDisconnected|Remote end closed connection|Connection aborted|Connection reset by peer'))

    # Add-Computer can commit before WinRM loses its response. Reconnect and
    # inspect Windows instead of blindly sending the same join again.
    - name: Wait for WinRM after an interrupted domain-join response
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10

    - name: Verify whether the interrupted domain join committed
      ansible.windows.win_powershell:
        script: |
          param([String] $DomainName)
          $Ansible.Changed = $false
          $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          if (-not $computer.PartOfDomain -or $computer.Domain -ne $DomainName) {
              throw 'Domain join response was lost and membership is not confirmed; inspect NetSetup.log before retrying'
          }
        parameters:
          DomainName: "{{ member_domain }}"

    - name: Complete the required reboot after a confirmed interrupted join
      ansible.builtin.set_fact:
        domain_state:
          reboot_required: true

- name: Reboot if needed
  win_reboot:
    reboot_timeout: 1500
    post_reboot_delay: 100
  when: domain_state.reboot_required

- name: Verify the joined domain and secure channel before continuing
  ansible.windows.win_powershell:
    script: |
      param([String] $DomainName, [String] $DomainController)
      $Ansible.Changed = $false
      $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
      if (-not $computer.PartOfDomain -or $computer.Domain -ne $DomainName) {
          throw 'The member server is not joined to the expected domain'
      }
      if (-not (Test-ComputerSecureChannel -Server $DomainController -ErrorAction Stop)) {
          throw 'The member server domain secure channel is not healthy'
      }
    parameters:
      DomainName: "{{ member_domain }}"
      DomainController: "{{ lab.hosts[dns_domain].hostname }}.{{ member_domain }}"
