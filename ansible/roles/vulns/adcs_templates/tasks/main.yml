- name: Refresh
  ansible.windows.win_command: gpupdate /force

- name: Install ADCSTemplate Module
  win_copy:
    src: files/ADCSTemplate
    dest: "C:\\Program Files\\WindowsPowerShell\\Modules"

- name: create a directory for templates
  win_file: 
    path: c:\setup
    state: directory

- name: Install templates
  ansible.windows.win_powershell:
    script: "{{ lookup('file', 'Configure-SelectedTemplate.ps1') }}"
    parameters:
      TemplateName: "{{ item.value.template_name }}"
      TemplateFile: "{{ item.value.template_file }}"
      EnrollPrincipal: '{{ domain }}\Domain Users'
      ControlPrincipal: "{{ item.value.control_principal | default('') }}"
    error_action: stop
  vars:
    ansible_become: yes
    ansible_become_method: runas
    domain_name: "{{domain}}"
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
  with_dict: "{{ vulns_vars }}"
