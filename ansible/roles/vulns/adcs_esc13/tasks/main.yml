# Adapted from the GPL-3.0 Ludus ESC13 role; intentionally vulnerable lab policy.
- name: Configure and verify ESC13 issuance policy without duplicate OIDs
  ansible.windows.win_powershell:
    script: "{{ lookup('file', 'esc13.ps1') }}"
    parameters:
      esc13group: "{{ item.value.adcs_esc13_group }}"
      esc13templateName: "{{ item.value.adcs_esc13_template }}"
    error_action: stop
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
  with_dict: "{{ vulns_vars }}"
