# Native GOAD lab gMSA preparation: retain the deliberate lab permissions.
- name: Resolve the forest KDS target in the originating host context
  ansible.builtin.set_fact:
    gmsa_kds_target: "{{ gmsa_kds_host | default(inventory_hostname) }}"
  when: ad_gmsa | length > 0

- name: Prepare one forest KDS root key without creating another key on rerun
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      Import-Module Kds -ErrorAction Stop
      # The native cmdlet returns a non-enumerated List<KdsRootKey>. Flatten it
      # explicitly: @() alone counts an empty list as one key.
      $keys = @(foreach ($key in (Get-KdsRootKey)) { $key })
      $Ansible.Changed = $keys.Count -eq 0
      if ($Ansible.Changed) {
          # ISOLATED LAB ONLY: backdate the KDS root key by 10 hours so gMSA
          # accounts can be provisioned immediately without waiting for the
          # production 10-hour AD replication safety window. Do not reuse this
          # setting in production Active Directory.
          Add-KdsRootKey -EffectiveTime (Get-Date).AddHours(-10) | Out-Null
          $keys = @(foreach ($key in (Get-KdsRootKey)) { $key })
      }
      foreach ($key in $keys) {
          $keyId = [guid]::Empty
          if (-not [guid]::TryParse([string]$key.KeyId, [ref]$keyId) -or
              $keyId -eq [guid]::Empty -or $key.EffectiveTime -isnot [datetime]) {
              throw 'KDS root key metadata is invalid; preserve existing keys for review'
          }
      }
      $effective = @($keys | Where-Object { $_.EffectiveTime -le (Get-Date) })
      if ($effective.Count -eq 0) { throw 'KDS root key is not effective; retain it and retry later' }
      # Key identifiers are public metadata; never serialize KdsRootKey objects/material.
      [pscustomobject]@{key_ids=@($effective | ForEach-Object { $_.KeyId.ToString() });effective=$true}
    error_action: stop
  register: gmsa_kds_preparation
  delegate_to: "{{ gmsa_kds_target }}"
  vars:
    ansible_become: true
    ansible_become_method: runas
    # Connection options are templated in the delegated host context. Read the
    # fixed originating-host fact rather than re-evaluating gmsa_kds_host there.
    ansible_become_user: "{{ lab.hosts[hostvars[inventory_hostname].gmsa_kds_target].domain }}\\{{ admin_user }}"
    ansible_become_password: "{{ lab.domains[lab.hosts[hostvars[inventory_hostname].gmsa_kds_target].domain].domain_password }}"
  when: ad_gmsa | length > 0

- name: Wait for the selected KDS key on the account domain controller
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param([string[]]$KeyIds)
      $ErrorActionPreference = 'Stop'
      Import-Module ActiveDirectory -ErrorAction Stop
      $Ansible.Changed = $false
      # Retry only missing replication, not malformed input or script/AD errors.
      $Ansible.Result = @{retryable=$false}
      $selected = @(foreach ($value in $KeyIds) {
          $id = [guid]::Empty
          if (-not [guid]::TryParse([string]$value, [ref]$id) -or $id -eq [guid]::Empty) {
              throw 'Selected KDS key identifier is missing or invalid'
          }
          $id.ToString('D')
      })
      if ($selected.Count -eq 0) { throw 'No effective KDS key was selected' }
      $server = $env:COMPUTERNAME
      $configuration = (Get-ADRootDSE -Server $server).configurationNamingContext
      if ([string]::IsNullOrWhiteSpace($configuration)) { throw 'Local DC returned no configuration naming context' }
      $path = "CN=Master Root Keys,CN=Group Key Distribution Service,CN=Services,$configuration"
      # CN is the root-key UUID (MS-GKDI 3.1.4.1); ObjectGUID is not the key ID.
      # Explicit enumeration handles an empty/non-enumerated AD result without
      # calling a method on a null Name or treating a collection as one key.
      $visible = @(foreach ($entry in (Get-ADObject -Server $server -SearchBase $path -SearchScope OneLevel -LDAPFilter '(objectClass=msKds-ProvRootKey)' -Properties cn)) {
          if ($null -eq $entry) { continue }
          $id = [guid]::Empty
          if (-not [guid]::TryParse([string]$entry.cn, [ref]$id) -and
              -not [guid]::TryParse([string]$entry.Name, [ref]$id)) {
              throw 'Local KDS root-key object has no valid CN; preserve existing keys for review'
          }
          if ($id -eq [guid]::Empty) { throw 'Local KDS root-key object has an empty key ID' }
          $id.ToString('D')
      })
      if (@($selected | Where-Object { $_ -in $visible }).Count -eq 0) {
          $Ansible.Result = @{retryable=$true;controller=$server;selected_keys=$selected.Count;visible_keys=$visible.Count}
          throw 'No selected effective KDS key has replicated to this domain controller'
      }
      [pscustomobject]@{controller=$server;kds_key_visible=$true}
    parameters:
      KeyIds: "{{ gmsa_kds_preparation.output[0].key_ids }}"
    error_action: stop
  vars:
    ansible_become: true
    ansible_become_method: runas
    # Child-domain administrators can see the forest object but not its Name/CN.
    # Read as this DC's computer identity; do not weaken the root-key ACL.
    ansible_become_user: SYSTEM
  when: ad_gmsa | length > 0
  register: gmsa_kds_visibility
  until: gmsa_kds_visibility is success or not (gmsa_kds_visibility.result.retryable | default(false) | bool)
  retries: 60
  delay: 10

- name: Create or verify the native gMSA without replacing unrelated account state
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param([string]$gMSA_Name, [string]$gMSA_FQDN, [string[]]$gMSA_SPNs, [string[]]$gMSA_HostNames)
      $ErrorActionPreference = 'Stop'
      Import-Module ActiveDirectory -ErrorAction Stop
      $server = $env:COMPUTERNAME
      $hosts = @($gMSA_HostNames | ForEach-Object { Get-ADComputer -Identity $_ -Server $server })
      if ($hosts.Count -eq 0) { throw 'gMSA requires an explicit retrieval computer' }
      $properties = @('DNSHostName','ServicePrincipalNames','PrincipalsAllowedToRetrieveManagedPassword')
      $account = @(Get-ADServiceAccount -Server $server -Filter {Name -eq $gMSA_Name} -Properties $properties)
      if ($account.Count -gt 1) { throw 'The selected gMSA name is ambiguous' }
      $Ansible.Changed = $account.Count -eq 0
      if ($Ansible.Changed) {
          New-ADServiceAccount -Server $server -Name $gMSA_Name -DNSHostName $gMSA_FQDN -PrincipalsAllowedToRetrieveManagedPassword $hosts -ServicePrincipalNames $gMSA_SPNs
      }
      $account = Get-ADServiceAccount -Server $server -Identity $gMSA_Name -Properties $properties
      if ($account.ObjectClass -ne 'msDS-GroupManagedServiceAccount' -or $account.DNSHostName -ne $gMSA_FQDN) {
          throw 'Existing account type or DNS name differs; preserving it for review'
      }
      $expectedSpns = @($gMSA_SPNs | Sort-Object -Unique)
      $actualSpns = @($account.ServicePrincipalNames | Sort-Object -Unique)
      $expectedHosts = @($hosts | ForEach-Object { $_.DistinguishedName } | Sort-Object -Unique)
      $actualHosts = @($account.PrincipalsAllowedToRetrieveManagedPassword | ForEach-Object {
          if ($_ -is [string]) { $_ } else { $_.DistinguishedName }
      } | Sort-Object -Unique)
      if (@(Compare-Object $expectedSpns $actualSpns).Count -or @(Compare-Object $expectedHosts $actualHosts).Count) {
          throw 'gMSA SPN or password-retrieval principals differ; preserving existing permissions'
      }
      [pscustomobject]@{account=$account.SamAccountName;account_sid=$account.SID.Value;configured_hosts=$actualHosts.Count;configuration_verified=$true}
    error_action: stop
    parameters:
      gMSA_Name: "{{ item.value.gMSA_Name }}"
      gMSA_FQDN: "{{ item.value.gMSA_FQDN }}"
      gMSA_SPNs: "{{ item.value.gMSA_SPNs }}"
      gMSA_HostNames: "{{ item.value.gMSA_HostNames }}"
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ domain_username }}"
    ansible_become_password: "{{ domain_password }}"
  with_dict: "{{ ad_gmsa }}"
