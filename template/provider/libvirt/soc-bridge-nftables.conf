# Operator-reviewed nftables isolation template for the GOAD-Light SOC bridge
# (soc-dedicated-es-private / virbr50, 192.168.50.0/24).
#
# Purpose (GD-01 / GD2-03):
#   Intentionally vulnerable GOAD-Light VMs (192.168.50.20-192.168.50.23) connect
#   their 3rd NIC to the SOC telemetry bridge so Elastic Agent can enroll and ship
#   events to Fleet Server / Elasticsearch on the SOC host gateway (192.168.50.1).
#   This ruleset confines traffic originating from virbr50 so compromised lab guests
#   can reach ONLY the explicitly allowed SOC ingestion endpoints and cannot pivot
#   to host management services, the LAN, Docker bridges, or the Internet.
#
# Operator validation & apply (review interface/IPs before loading):
#   sudo nft -c -f template/provider/libvirt/soc-bridge-nftables.conf
#   sudo nft -f template/provider/libvirt/soc-bridge-nftables.conf

table inet goad_soc_isolation {
    set goad_lab_guests {
        type ipv4_addr
        elements = { 192.168.50.20, 192.168.50.21, 192.168.50.22, 192.168.50.23 }
    }

    # Adjust to the exact SOC telemetry ports bound on the bridge gateway (192.168.50.1).
    # Default: Elastic Fleet Server (8220/tcp) and Elasticsearch ingest (9200/tcp).
    set soc_ingest_tcp_ports {
        type inet_service
        elements = { 8220, 9200 }
    }

    chain input {
        type filter hook input priority -10; policy accept;

        # Only enforce on the dedicated GOAD-to-SOC bridge.
        iifname != "virbr50" accept

        ct state established,related accept
        ct state invalid drop

        # Allow ICMP echo for basic link diagnostics (rate-limited).
        ip saddr @goad_lab_guests ip daddr 192.168.50.1 icmp type echo-request limit rate 5/second accept

        # Allow ONLY explicit telemetry ingest ports from the GOAD guests to the SOC gateway.
        ip saddr @goad_lab_guests ip daddr 192.168.50.1 tcp dport @soc_ingest_tcp_ports accept

        # Block all other host-bound traffic from virbr50 (SSH, Kibana, TheHive, Shuffle, Docker, etc.).
        log prefix "goad-soc-input-drop: " limit rate 10/minute drop
    }

    chain forward {
        type filter hook forward priority -10; policy accept;

        # Prevent GOAD guests on virbr50 from forwarding to LAN, WAN, or other libvirt/Docker networks.
        iifname "virbr50" ct state established,related accept
        iifname "virbr50" log prefix "goad-soc-fwd-drop: " limit rate 10/minute drop
    }
}
